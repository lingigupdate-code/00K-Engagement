name: Auto Update Data from Google Sheets

on:
  schedule:
    # รันอัตโนมัติทุกๆ 3 ชั่วโมง
    - cron: '0 */1 * * *'
  workflow_dispatch: # ปุ่มกดสั่งรันมือได้เองใน GitHub

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # ให้สิทธิ์เขียนไฟล์กลับลงใน GitHub Repository

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch Data and Save JSON
        run: node fetch-data.js

      - name: Commit and Push if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # แก้ไขบรรทัดนี้: ใส่ชื่อไฟล์ JSON ที่ดึงจริง (หรือใช้ *.json เพื่อดึงไฟล์ json ทั้งหมดที่สร้างขึ้น)
          git add data-presenter.json data-ckss27.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update JSON files [skip ci]" && git push)
