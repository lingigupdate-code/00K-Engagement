name: Update Captions Data Only

on:
  workflow_dispatch:

jobs:
  update-captions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run Captions Fetch Script
        run: node scripts/fetch-captions.js # เปลี่ยนเป็นสคริปต์ดึงแคปชันของคุณ

      - name: Commit and Push Captions
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Manual update: captions data"
          file_pattern: data/data-captions.json
