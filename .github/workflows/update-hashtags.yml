name: Update Hashtags Data Only

on:
  workflow_dispatch:

jobs:
  update-hashtags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run Hashtags Fetch Script
        run: node scripts/fetch-hashtags.js # เปลี่ยนเป็นสคริปต์ดึงแฮชแท็กของคุณ

      - name: Commit and Push Hashtags
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Manual update: hashtags data"
          file_pattern: data-hashtags.json
